server:
  port: 8191
  servlet:
    context-path: /api #上下文路径

spring:
  application:
    name: wild-im-backend
  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.58.161:3306/wild_im_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf-8
    username: root
    password: root
    #数据库连接池配置
    hikari:
      connection-test-query: SELECT 1 #数据库连接测试查询
      maximum-pool-size: 20 #连接池最大连接数
      minimum-idle: 5 #连接池最小空闲连接数
      idle-timeout: 30000 #连接空闲超时时间
      max-lifetime: 60000 #连接最大生命周期时间
  #Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss #日期格式
    time-zone: GMT+8 #时间区
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启下划线转驼峰命名
  #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启日志打印
  global-config:
    db-config:
      logic-delete-field: isDeleted # 逻辑删除字段名
      logic-delete-value: 1 # 逻辑删除值
      logic-not-delete-value: 0 # 逻辑未删除值
    banner: false # 关闭启动时的 banner
# 自定义日志配置 (对应 logback 配置文件中的 springProperty)
log:
  file: logs/wild-im               # 日志存放的目录及前缀
  maxsize: 2MB                   # 单个日志文件的最大大小
  level:
    root: INFO                     # 全局基础日志级别（控制 Spring、Tomcat 等）
    me: DEBUG                      # 你的业务代码 (cn.okcl.im) 的日志级别 (开发时可改 DEBUG)
    sql: DEBUG                     # Mapper 接口的日志级别，必须是 DEBUG 才能打印 SQL

jwt:
  # 密钥（必须足够长，最少 32 字节/字符，保障 HMAC256 安全）
  secret: YourSuperSecretKeyWithAtLeast32BytesLengthForSecurity
  # 签发人
  issuer: wild-im
  # 默认过期时间（毫秒，比如 2 小时 = 7200000）
  expire: 7200000